[project]
name = "pythonkni"
version = "0.1.0"
description = "Aplicacion de escritorio en Python y PyQt5 con herramientas de mantenimiento, red y archivos."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "PythonKni contributors" }
]
dependencies = [
  "PyQt5>=5.15,<5.16",
  "pypdf>=6.16.2,<7.0",
  "PyMuPDF>=1.28,<2.0",
  "reportlab>=5.0,<6.0",
  "Pillow>=12.3,<13.0",
  "python-docx>=1.2,<2.0",
  "psutil>=7.2,<8.0",
  "requests>=2.34,<3.0",
  "py7zr>=1.1,<2.0",
  "pytesseract>=0.3.13,<0.4",
  "pdf2image>=1.17,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "pytest-qt>=4.5,<5.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.16,<0.17",
  "pyinstaller>=6.22,<7.0",
  "pip-audit>=2.10,<3.0",
  "pip-tools>=7.6,<8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt5"

[tool.coverage.run]
branch = true
source = ["pythonkni", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I"]
