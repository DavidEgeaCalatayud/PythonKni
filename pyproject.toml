[project]
name = "pythonkni"
version = "0.1.0"
description = "Aplicacion de escritorio en Python y PyQt5 con herramientas de mantenimiento, red y archivos."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "PythonKni contributors" }
]
dependencies = [
  "PyQt5>=5.15",
  "PyPDF2>=3.0",
  "PyMuPDF>=1.23",
  "reportlab>=4.0",
  "Pillow>=10.0",
  "python-docx>=1.1",
  "psutil>=5.9",
  "requests>=2.31",
  "py7zr>=0.22.0",
  "pytesseract>=0.3",
  "pdf2image>=1.17"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt5"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.15",
  "pyinstaller>=6.0"
]

[tool.coverage.run]
branch = true
source = ["pythonkni", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["F", "I"]
