name: Apply UI service refactor once

on:
  push:
    branches:
      - refactor/ui-service-separation

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add architecture refactor helper'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/ui-service-separation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install formatter
        run: python -m pip install ruff

      - name: Apply architecture migration
        run: python scripts/refactor_ui_service.py

      - name: Format generated Python
        run: |
          python -m ruff format pythonkni tools/event_viewer_tool.py tools/startup_manager_tool.py tools/system_report_tool.py tools/pdf_tasks.py tools/pdf_merge_tool.py tests/test_event_viewer_service.py tests/test_startup_manager_transactions.py tests/test_system_report_qt.py tests/test_pdf_pages.py tests/test_architecture_boundaries.py scripts/refactor_ui_service.py

      - name: Compile generated source
        run: python -m compileall pythonkni tools tests

      - name: Static validation
        run: python -m ruff check .

      - name: Commit generated architecture
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pythonkni docs/architecture.md tools/event_viewer_tool.py tools/startup_manager_tool.py tools/system_report_tool.py tools/pdf_tasks.py tools/pdf_merge_tool.py tests/test_event_viewer_service.py tests/test_startup_manager_transactions.py tests/test_system_report_qt.py tests/test_pdf_pages.py tests/test_architecture_boundaries.py scripts/refactor_ui_service.py
          git commit -m 'Separate UI from business services'
          git push origin HEAD:refactor/ui-service-separation
