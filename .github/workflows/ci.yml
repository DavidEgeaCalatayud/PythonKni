name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  python38-archive-compat:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install legacy archive dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyQt5>=5.15,<5.16" "py7zr==0.22.0"

      - name: Verify archive tool loads with legacy py7zr
        shell: powershell
        run: |
          @'
          import py7zr
          import tools.archive_tool
          from pythonkni.archive import service

          print(f"py7zr {py7zr.__version__}")
          if service.HAS_STREAMING_7Z_FACTORY:
              raise SystemExit("py7zr 0.22.0 unexpectedly exposes the modern streaming factory API")

          try:
              service._require_streaming_7z_factory()
          except RuntimeError as error:
              if "py7zr >= 1.0.0" not in str(error):
                  raise
          else:
              raise SystemExit("Legacy py7zr must fail closed for secure 7Z extraction")
          '@ | python -

  validate:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt "pytest-cov>=5.0,<6.0" ruff pyinstaller

      - name: Compile Python files
        run: python -m compileall .

      - name: Run tests with coverage gate
        run: python -m pytest --cov=pythonkni --cov=tools --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Enforce service-layer coverage
        run: python -m coverage report --include="pythonkni/*/service.py" --fail-under=85

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Build Windows bundle
        run: pyinstaller --noconfirm --clean PythonKni.spec

      - name: Smoke test packaged application
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist\PythonKni\PythonKni.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller did not produce $exe"
          }

          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Package validated Windows bundle
        shell: powershell
        run: .\scripts\package_windows_bundle.ps1 -OutputPrefix "PythonKni-windows-x64"

      - name: Upload validated Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: PythonKni-windows-${{ github.sha }}
          path: |
            dist/PythonKni-windows-x64.zip
            dist/PythonKni-windows-x64.sha256
          if-no-files-found: error
          retention-days: 14
