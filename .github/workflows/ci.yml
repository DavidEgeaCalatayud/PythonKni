name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt ruff pyinstaller

      - name: Compile Python files
        run: python -m compileall .

      - name: Run tests
        run: python -m pytest

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Build Windows bundle
        run: pyinstaller --noconfirm --clean PythonKni.spec

      - name: Smoke test packaged application
        shell: powershell
        run: |
          $exe = Join-Path $PWD "dist\PythonKni\PythonKni.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller did not produce $exe"
          }

          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged application smoke test failed with exit code $LASTEXITCODE"
          }
