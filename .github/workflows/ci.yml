name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  refresh-development-lock:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10.11"

      - name: Install current hash-locked tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Resolve patched development lock
        run: |
          python -m piptools compile requirements-dev.in --generate-hashes --allow-unsafe --strip-extras --no-header --output-file requirements-dev.txt

      - name: Commit patched development lock
        shell: powershell
        run: |
          git diff --quiet -- requirements-dev.txt
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Development lock already matches the requested policy."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.txt
          git commit -m "Update development lock to patched setuptools"
          git push origin "HEAD:${{ github.ref_name }}"
