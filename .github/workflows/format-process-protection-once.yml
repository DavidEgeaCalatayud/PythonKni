name: Format process protection once

on:
  push:
    branches:
      - fix/process-manager-protections

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/process-manager-protections

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.4

      - name: Format changed files
        run: python -m ruff format tools/process_manager_tool.py tests/test_process_manager_protection.py

      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/process_manager_tool.py tests/test_process_manager_protection.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Apply Ruff formatting to process protections"
          git push origin HEAD:fix/process-manager-protections
