name: Validate network scanner once

on:
  push:
    branches:
      - feature/network-scanner-cidr-concurrency

permissions:
  contents: write

jobs:
  validate-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/network-scanner-cidr-concurrency

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fix constant-time CIDR host count
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tools/network_tool.py")
          text = path.read_text(encoding="utf-8")
          old = "    host_count = sum(1 for _ in network.hosts())\n"
          new = (
              "    host_count = network.num_addresses\n"
              "    if network.prefixlen < 31:\n"
              "        host_count = max(0, host_count - 2)\n"
          )
          if old not in text:
              raise RuntimeError("Expected CIDR host-count expression not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          qt_test = Path("tests/test_network_scanner_qt.py")
          qt_text = qt_test.read_text(encoding="utf-8")
          qt_text = qt_text.replace("from types import SimpleNamespace\n\n", "")
          qt_test.write_text(qt_text, encoding="utf-8")
          '@ | python

      - name: Install validation tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-qt ruff==0.16.4

      - name: Format changed files
        run: python -m ruff format tools/network_tool.py tests/test_network_validation.py tests/test_network_scanner_qt.py

      - name: Validate changes
        run: |
          python -m compileall .
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit validated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/network_tool.py tests/test_network_validation.py tests/test_network_scanner_qt.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Validate network scanner concurrency"
          git push origin HEAD:feature/network-scanner-cidr-concurrency
