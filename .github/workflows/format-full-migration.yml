name: Format full architecture migration

on:
  push:
    branches:
      - refactor/full-domain-architecture

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Ruff
        run: pip install ruff==0.16.4
      - name: Format migrated code
        shell: pwsh
        run: |
          python -m ruff format .
          Remove-Item .github/workflows/format-full-migration.yml
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Format layered architecture migration"
            git push origin HEAD:refactor/full-domain-architecture
          }
