name: OUI Registry Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10.11"

      - name: Refresh bundled IEEE MA-L registry
        run: python scripts/update_oui_registry.py update

      - name: Validate normalized registry offline
        run: python scripts/update_oui_registry.py validate

      - name: Check whether IEEE data changed
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- assets/network_oui_prefixes.csv assets/network_oui_prefixes.meta.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundled IEEE MA-L registry is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("assets/network_oui_prefixes.meta.json").read_text(encoding="utf-8")
          )
          print("### IEEE MA-L registry refresh")
          print()
          print(f"- Assignments: {metadata['entry_count']}")
          print(f"- Source duplicates: {metadata['duplicate_assignment_count']}")
          print(f"- Retrieved: {metadata['retrieved_at']}")
          print(f"- Source SHA-256: `{metadata['source_sha256']}`")
          print(f"- Registry SHA-256: `{metadata['registry_sha256']}`")
          PY
          fi

      - name: Create automated maintenance pull request
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/oui-registry-${GITHUB_RUN_ID}"

          git config user.name "DavidEgea"
          git config user.email "114010484+DavidEgeaCalatayud@users.noreply.github.com"
          git switch -c "$branch"
          git add assets/network_oui_prefixes.csv assets/network_oui_prefixes.meta.json
          git commit -m "Update bundled IEEE OUI registry"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update bundled IEEE OUI registry" \
            --body "Automated refresh from the official IEEE Registration Authority MA-L public CSV. The generated registry is normalized, validated and remains fully offline at application runtime."

          gh workflow run ci.yml --ref "$branch"
