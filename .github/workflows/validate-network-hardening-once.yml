name: Validate network hardening once

on:
  push:
    branches:
      - fix/network-scanner-hardening

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/network-scanner-hardening

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt ruff

      - name: Finalize bounded cancellation
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/network_tool.py")
          text = path.read_text(encoding="utf-8")
          old = """    fill_pending()
          while pending:
              done, _ = wait(tuple(pending), return_when=FIRST_COMPLETED)
              for future in done:
                  item = pending.pop(future)
                  yield item, future
              if stop_event.is_set():
                  for future in pending:
                      future.cancel()
                  break
              fill_pending()
          """
          new = """    fill_pending()
          while pending:
              done, _ = wait(tuple(pending), return_when=FIRST_COMPLETED)
              if stop_event.is_set():
                  for future in pending:
                      future.cancel()
                  return
              for future in done:
                  item = pending.pop(future)
                  yield item, future
                  if stop_event.is_set():
                      for pending_future in pending:
                          pending_future.cancel()
                      return
              fill_pending()
          """
          if old not in text:
              raise SystemExit("bounded future block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              """        for ip, future in results:
              if stop_event.is_set():
                  break
              try:
          """,
              """        for ip, future in results:
              try:
          """,
              1,
          )
          text = text.replace(
              """        for port, future in results:
              if stop_event.is_set():
                  break
              try:
          """,
              """        for port, future in results:
              try:
          """,
              1,
          )
          path.write_text(text, encoding="utf-8")

      - name: Format changed files
        run: python -m ruff format tools/network_tool.py tests/test_network_validation.py tests/test_network_scanner_qt.py

      - name: Compile Python files
        run: python -m compileall .

      - name: Run tests
        run: python -m pytest

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Commit validated formatting
        shell: pwsh
        run: |
          git config user.name "DavidEgea"
          git config user.email "114010484+DavidEgeaCalatayud@users.noreply.github.com"
          git add -- tools/network_tool.py tests/test_network_validation.py tests/test_network_scanner_qt.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "Finalize network scanner hardening"
            git push origin HEAD:fix/network-scanner-hardening
          }
