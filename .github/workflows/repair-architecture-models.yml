name: Repair architecture models

on:
  push:
    branches:
      - refactor/full-domain-architecture

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Repair dataclass extraction
        run: python scripts/repair_architecture_models.py
      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Repair dataclass model extraction"
            git push origin HEAD:refactor/full-domain-architecture
          }
