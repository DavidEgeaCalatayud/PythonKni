name: Apply BaseTool contract refactor once

on:
  push:
    branches:
      - refactor/base-tool-contract

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/base-tool-contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Refactor tools to BaseTool contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          tools = {
              "archive_tool.py": ("Comprime y extrae archivos ZIP y 7Z.", "Archivos"),
              "config_window_tool.py": ("Configura el tema y el idioma de la aplicación.", "Configuración"),
              "converter_tool.py": ("Convierte imágenes, PDF, texto, Word y KML.", "Archivos"),
              "disk_analyzer_tool.py": ("Analiza el uso de espacio en disco y carpetas.", "Sistema"),
              "duplicate_tool.py": ("Localiza y gestiona archivos duplicados.", "Archivos"),
              "event_viewer_tool.py": ("Consulta y analiza eventos de Windows.", "Sistema"),
              "network_tool.py": ("Ejecuta diagnósticos y utilidades de red.", "Red"),
              "pdf_merge_tool.py": ("Divide, combina, reordena y extrae contenido de PDF.", "PDF"),
              "process_manager_tool.py": ("Consulta, analiza y administra procesos del sistema.", "Sistema"),
              "startup_manager_tool.py": ("Administra aplicaciones configuradas para iniciar con Windows.", "Sistema"),
              "system_report_tool.py": ("Genera informes técnicos de hardware y software.", "Sistema"),
              "temp_cleaner_tool.py": ("Analiza y limpia ubicaciones temporales autorizadas.", "Sistema"),
              "wifi_tool.py": ("Consulta perfiles y datos de redes Wi-Fi guardadas.", "Red"),
          }

          for filename, (description, category) in tools.items():
              path = Path("tools") / filename
              text = path.read_text(encoding="utf-8")
              if "class Tool(QMainWindow):" not in text:
                  raise RuntimeError(f"Unexpected Tool declaration in {path}")
              text = text.replace("class Tool(QMainWindow):", "class Tool(BaseTool):", 1)

              class_pos = text.index("class Tool(BaseTool):")
              init_pos = text.find("    def __init__(self):", class_pos)
              if init_pos < 0:
                  raise RuntimeError(f"No zero-argument Tool.__init__ found in {path}")
              text = text[:init_pos] + text[init_pos:].replace(
                  "    def __init__(self):", "    def setup_ui(self):", 1
              )
              setup_pos = text.index("    def setup_ui(self):", class_pos)
              super_pos = text.find("        super().__init__()\n", setup_pos)
              if super_pos < 0:
                  raise RuntimeError(f"No super().__init__ call found in {path}")
              text = text[:super_pos] + text[super_pos + len("        super().__init__()\n"):]

              name_match = re.search(r"(?m)^    name\s*=\s*.+$", text[class_pos:])
              if not name_match:
                  raise RuntimeError(f"No Tool.name found in {path}")
              absolute_start = class_pos + name_match.start()
              absolute_end = class_pos + name_match.end()
              name_line = text[absolute_start:absolute_end]
              metadata = (
                  f"{name_line}\n"
                  f"    description = {description!r}\n"
                  f"    category = {category!r}"
              )
              text = text[:absolute_start] + metadata + text[absolute_end:]

              if "from __future__ import annotations\n" in text:
                  text = text.replace(
                      "from __future__ import annotations\n",
                      "from __future__ import annotations\n\nfrom tools.base_tool import BaseTool\n",
                      1,
                  )
              else:
                  text = "from tools.base_tool import BaseTool\n\n" + text
              path.write_text(text, encoding="utf-8")

          Path("tools/base_tool.py").write_text('''from PyQt5.QtWidgets import QMainWindow\n\n\nclass BaseTool(QMainWindow):\n    """Common lifecycle and metadata contract for every PythonKni GUI tool."""\n\n    name: str = ""\n    description: str = ""\n    category: str = "General"\n\n    def __init__(self, *args, **kwargs):\n        super().__init__(*args, **kwargs)\n        self.setup_ui()\n\n    def setup_ui(self) -> None:\n        """Build the tool user interface. Subclasses must override this method."""\n        raise NotImplementedError\n''', encoding="utf-8")

          main = Path("main.py")
          text = main.read_text(encoding="utf-8")
          text = text.replace("import importlib\n", "import importlib\nimport inspect\n", 1)
          text = text.replace(
              "from tools.app_paths import CONFIG_FILE\n",
              "from tools.app_paths import CONFIG_FILE\nfrom tools.base_tool import BaseTool\n",
              1,
          )
          marker = "logger = logging.getLogger(__name__)\n\n\n"
          contract = '''logger = logging.getLogger(__name__)\n\n\nclass ToolContractError(TypeError):\n    """Raised when a dynamically discovered tool violates the BaseTool contract."""\n\n\ndef validate_tool_class(tool_class, module_name="<tool>"):\n    if not inspect.isclass(tool_class):\n        raise ToolContractError(f"{module_name}.Tool must be a class")\n    if not issubclass(tool_class, BaseTool):\n        raise ToolContractError(f"{module_name}.Tool must inherit from BaseTool")\n    if tool_class.setup_ui is BaseTool.setup_ui:\n        raise ToolContractError(f"{module_name}.Tool must implement setup_ui()")\n\n    for attribute in ("name", "description", "category"):\n        value = getattr(tool_class, attribute, None)\n        if not isinstance(value, str) or not value.strip():\n            raise ToolContractError(\n                f"{module_name}.Tool.{attribute} must be a non-empty string"\n            )\n\n    return tool_class\n\n\n'''
          if marker not in text:
              raise RuntimeError("Could not locate logger marker in main.py")
          text = text.replace(marker, contract, 1)
          old = '''                    module = importlib.import_module(module_name)\n                    tool_class = getattr(module, "Tool")\n'''
          new = '''                    module = importlib.import_module(module_name)\n                    tool_class = validate_tool_class(getattr(module, "Tool"), module_name)\n'''
          if old not in text:
              raise RuntimeError("Could not locate loader import block in main.py")
          text = text.replace(old, new, 1)
          main.write_text(text, encoding="utf-8")

          Path("tests/test_tool_contract.py").write_text('''import importlib\nfrom pathlib import Path\n\nimport pytest\n\nfrom main import ToolContractError, validate_tool_class\nfrom tools.base_tool import BaseTool\n\n\ndef iter_tool_modules():\n    tools_dir = Path(__file__).resolve().parents[1] / "tools"\n    for path in sorted(tools_dir.glob("*_tool.py")):\n        if path.name == "base_tool.py":\n            continue\n        yield f"tools.{path.stem}"\n\n\ndef test_every_discovered_tool_implements_base_tool_contract():\n    modules = list(iter_tool_modules())\n    assert modules\n\n    for module_name in modules:\n        module = importlib.import_module(module_name)\n        tool_class = validate_tool_class(module.Tool, module_name)\n        assert issubclass(tool_class, BaseTool)\n        assert tool_class.setup_ui is not BaseTool.setup_ui\n        assert tool_class.name.strip()\n        assert tool_class.description.strip()\n        assert tool_class.category.strip()\n\n\ndef test_contract_rejects_non_base_tool_classes():\n    class InvalidTool:\n        name = "Invalid"\n        description = "Invalid"\n        category = "Tests"\n\n        def setup_ui(self):\n            pass\n\n    with pytest.raises(ToolContractError, match="inherit from BaseTool"):\n        validate_tool_class(InvalidTool, "tests.invalid")\n\n\ndef test_contract_rejects_missing_setup_ui_override():\n    class InvalidTool(BaseTool):\n        name = "Invalid"\n        description = "Invalid"\n        category = "Tests"\n\n    with pytest.raises(ToolContractError, match="implement setup_ui"):\n        validate_tool_class(InvalidTool, "tests.invalid")\n\n\n@pytest.mark.parametrize("attribute", ["name", "description", "category"])\ndef test_contract_rejects_empty_metadata(attribute):\n    class InvalidTool(BaseTool):\n        name = "Valid"\n        description = "Valid"\n        category = "Tests"\n\n        def setup_ui(self):\n            pass\n\n    setattr(InvalidTool, attribute, "   ")\n    with pytest.raises(ToolContractError, match=attribute):\n        validate_tool_class(InvalidTool, "tests.invalid")\n''', encoding="utf-8")
          '@ | python

      - name: Install validation tools
        run: python -m pip install -r requirements.txt pytest ruff==0.16.4

      - name: Auto-fix imports and format
        run: |
          python -m ruff check --fix .
          python -m ruff format .

      - name: Validate refactor
        run: |
          python -m compileall .
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.py tools/base_tool.py tools/archive_tool.py tools/config_window_tool.py tools/converter_tool.py tools/disk_analyzer_tool.py tools/duplicate_tool.py tools/event_viewer_tool.py tools/network_tool.py tools/pdf_merge_tool.py tools/process_manager_tool.py tools/startup_manager_tool.py tools/system_report_tool.py tools/temp_cleaner_tool.py tools/wifi_tool.py tests/test_tool_contract.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Enforce BaseTool contract across GUI tools"
          git push origin HEAD:refactor/base-tool-contract
