name: Architecture migration bootstrap

on:
  push:
    branches:
      - refactor/full-domain-architecture

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run architecture migration
        run: python scripts/architecture_migration.py
      - name: Commit migrated architecture
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "Migrate remaining domains to layered architecture"
            git push origin HEAD:refactor/full-domain-architecture
          }
