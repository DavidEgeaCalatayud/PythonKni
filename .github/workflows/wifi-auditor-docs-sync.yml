name: WiFi Auditor Docs Sync

on:
  push:
    branches:
      - feat/wifi-auditor-safe

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10.11"

      - name: Synchronize documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected documentation anchor not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "README.md",
              "![Tests](https://img.shields.io/badge/tests-686%20pytest-green)\n![Coverage](https://img.shields.io/badge/branch%20coverage-92.9%25-green)\n![Services](https://img.shields.io/badge/service%20coverage-93.2%25-green)",
              "![Tests](https://img.shields.io/badge/tests-731%20pytest-green)\n![Coverage](https://img.shields.io/badge/branch%20coverage-93.1%25-green)\n![Services](https://img.shields.io/badge/service%20coverage-93.6%25-green)",
          )
          replace_once(
              "README.md",
              "system reporting, WiFi diagnostics and safe temporary-file cleanup",
              "system reporting, WiFi diagnostics, defensive WiFi auditing and safe temporary-file cleanup",
          )
          replace_once(
              "README.md",
              "| **WiFi Profiles** | Read locally stored Windows WiFi profiles for authorized support/diagnostics |",
              "| **WiFi Profiles** | Read locally stored Windows WiFi profiles for authorized support/diagnostics |\n| **WiFi Auditor** | One-click defensive visible-network inventory, security/channel findings, score and SHA-256 evidence reporting |",
          )
          replace_once(
              "README.md",
              "startup          system_report    temp_cleaner\nwifi",
              "startup          system_report    temp_cleaner\nwifi             wifi_auditor",
          )
          replace_once(
              "README.md",
              "│  ├─ architecture.md\n│  ├─ security.md\n│  └─ usage.md",
              "│  ├─ architecture.md\n│  ├─ security.md\n│  ├─ usage.md\n│  └─ wifi-auditor.md",
          )
          replace_once(
              "README.md",
              "├─ scripts/\n│  ├─ check_dependency_locks.py\n│  └─ package_windows_bundle.ps1",
              "├─ docker/\n│  └─ wifi-auditor/\n├─ scripts/\n│  ├─ check_dependency_locks.py\n│  ├─ package_windows_bundle.ps1\n│  └─ verify_wifi_audit_report.py",
          )
          replace_once("README.md", "contains **686 tests**", "contains **731 tests**")
          replace_once(
              "README.md",
              "Repository-wide                 92.9%\nAll service.py modules          93.2%",
              "Repository-wide                 93.1%\nAll service.py modules          93.6%",
          )
          replace_once(
              "README.md",
              "WiFi service                    96.0%",
              "WiFi service                    96.0%\nWiFi Auditor service            99.1%",
          )
          replace_once(
              "README.md",
              "WiFi window                     95.0%",
              "WiFi window                     95.0%\nWiFi Auditor window             99.2%",
          )
          replace_once(
              "README.md",
              "The presentation-hardening pass deliberately targets real orchestration contracts rather than changing production behavior just to increase coverage. Converter and Network include worker overlap/cancellation and I/O flows; Process Manager covers termination/VirusTotal orchestration; Archive, Duplicate, Disk Analyzer, Temp Cleaner, Config, WiFi and System Report cover their corresponding state, dialog and error paths.",
              "The presentation-hardening pass deliberately targets real orchestration contracts rather than changing production behavior just to increase coverage. Converter and Network include worker overlap/cancellation and I/O flows; Process Manager covers termination/VirusTotal orchestration; Archive, Duplicate, Disk Analyzer, Temp Cleaner, Config, WiFi and System Report cover their corresponding state, dialog and error paths. WiFi Auditor adds deterministic parsing/scoring, cancellation, evidence integrity and UI/export regressions while keeping offensive credential-acquisition behavior out of scope.",
          )
          replace_once(
              "README.md",
              "WiFi service coverage                              >= 95.5%",
              "WiFi service coverage                              >= 95.5%\nWiFi Auditor service coverage                      >= 98.0%",
          )
          replace_once(
              "README.md",
              "WiFi window coverage                               >= 94.5%",
              "WiFi window coverage                               >= 94.5%\nWiFi Auditor window coverage                       >= 98.0%",
          )
          replace_once(
              "README.md",
              "- Network/system capabilities depend on Windows permissions, topology, firewall policy and available OS utilities.",
              "- Network/system capabilities depend on Windows permissions, topology, firewall policy and available OS utilities.\n- WiFi Auditor uses Windows visible-network enumeration only: it does not enable monitor mode, actively probe WPS, capture authentication material, validate passwords, crack PSKs or create deceptive access points.",
          )
          replace_once(
              "README.md",
              "- [`docs/security.md`](docs/security.md) — security controls, sensitive-data flows, destructive operations and supply-chain limits",
              "- [`docs/security.md`](docs/security.md) — security controls, sensitive-data flows, destructive operations and supply-chain limits\n- [`docs/wifi-auditor.md`](docs/wifi-auditor.md) — defensive WiFi audit workflow, evidence semantics, Docker verifier and explicit scope boundaries",
          )

          replace_once(
              "docs/architecture.md",
              "├─ temp_cleaner/\n└─ wifi/",
              "├─ temp_cleaner/\n├─ wifi/\n└─ wifi_auditor/",
          )
          replace_once(
              "docs/architecture.md",
              "## Compatibility and plugin boundary",
              "## WiFi Auditor boundary\n\n`wifi_auditor.service` owns Windows visible-network parsing, deterministic configuration findings, scoring and SHA-256 evidence generation. `wifi_auditor.window` owns the one-click managed-worker flow, cancellation, result rendering and export dialogs. The service never imports Qt.\n\nThe live scan is intentionally limited to information Windows exposes through `netsh wlan show networks mode=bssid`; no monitor-mode or credential-validation behavior is delegated to the service. Docker support is separated from live scanning and is limited to offline verification of exported evidence. The SHA-256 field is an integrity checksum over canonical report data, not a digital signature or provenance proof.\n\n## Compatibility and plugin boundary",
          )
          replace_once("docs/architecture.md", "686 pytest tests + branch coverage", "731 pytest tests + branch coverage")
          replace_once(
              "docs/architecture.md",
              "Current presentation-hardened baseline\n686 tests\n92.9% repository branch coverage\n93.2% aggregated services",
              "Current WiFi-Auditor baseline\n731 tests\n93.1% repository branch coverage\n93.6% aggregated services",
          )
          replace_once(
              "docs/architecture.md",
              "WiFi service                    96.0%",
              "WiFi service                    96.0%\nWiFi Auditor service            99.1%",
          )
          replace_once(
              "docs/architecture.md",
              "WiFi window                     95.0%",
              "WiFi window                     95.0%\nWiFi Auditor window             99.2%",
          )
          replace_once(
              "docs/architecture.md",
              "WiFi service coverage                              >= 95.5%",
              "WiFi service coverage                              >= 95.5%\nWiFi Auditor service coverage                      >= 98.0%",
          )
          replace_once(
              "docs/architecture.md",
              "WiFi window coverage                               >= 94.5%",
              "WiFi window coverage                               >= 94.5%\nWiFi Auditor window coverage                       >= 98.0%",
          )

          wifi_usage = '''## WiFi Auditor\n\n**Menu name:** `WiFi Auditor` (category `Red`)\n\nPress **Escanear redes visibles** to run one managed defensive pipeline: Windows visible-network inventory → SSID/BSSID normalization → band/channel/signal/security review → deterministic findings/score → exportable SHA-256 evidence. The operation supports cooperative cancellation and rejects overlapping scans.\n\nThe live scan uses `netsh wlan show networks mode=bssid`. It does not require stored WiFi passwords and does not enable monitor mode. The tool does not actively probe WPS, capture authentication exchanges, validate WiFi passwords, generate target password lists, crack PSKs or create clone/deceptive access points.\n\nExported JSON reports include the observed access points, findings, score, declared limitations and an integrity digest. Report publication uses same-directory temporary output, flush/`fsync` and `os.replace` before the destination becomes visible. The SHA-256 digest detects report changes; it is not a digital signature.\n\nOffline verification:\n\n```powershell\npython scripts/verify_wifi_audit_report.py .\\wifi-audit.json\n```\n\nDocker can run the verifier without attempting to control the host wireless adapter:\n\n```powershell\ndocker build -f docker/wifi-auditor/Dockerfile -t pythonkni-wifi-audit-verifier .\ndocker run --rm -v "${PWD}:/data:ro" pythonkni-wifi-audit-verifier /data/wifi-audit.json\n```\n\nSee [`wifi-auditor.md`](wifi-auditor.md) for the complete evidence format, scoring semantics, limitations and scope boundaries.\n\n'''
          replace_once("docs/usage.md", "## Disk Analyzer\n", wifi_usage + "## Disk Analyzer\n")
          replace_once(
              "docs/usage.md",
              "contains **686 tests**, with **92.9% repository-wide branch coverage** and **93.2% aggregate service coverage**",
              "contains **731 tests**, with **93.1% repository-wide branch coverage** and **93.6% aggregate service coverage**",
          )
          replace_once(
              "docs/usage.md",
              "for every first-party service and for the 13 prioritized presentation windows",
              "for every first-party service and for the 14 prioritized presentation windows",
          )
          replace_once(
              "docs/usage.md",
              "WiFi             >= 94.5%",
              "WiFi             >= 94.5%      WiFi Auditor     >= 98.0%",
          )

          wifi_security = '''# WiFi Auditor\n\nWiFi Auditor is a defensive configuration/inventory boundary separate from the stored-profile viewer. Its live path asks Windows for visible BSSID metadata and analyzes only the information exposed by that operating-system command. It does not obtain or validate credentials.\n\nThe current feature deliberately excludes monitor mode, frame injection, active WPS probing, authentication-material capture, password-list generation, password cracking and deceptive/clone access points. An inconsistent SSID/security observation is surfaced as a manual-review indicator and is not treated as proof that a BSSID is malicious.\n\nExported evidence contains local wireless metadata such as SSID/BSSID, channel, signal and security configuration. Treat those reports as environment-sensitive diagnostic data before sharing them.\n\nEach report contains a SHA-256 integrity digest calculated over canonical JSON. Verification can detect changed content but does not authenticate the person or machine that created the report. The digest is not a digital signature and does not by itself establish forensic chain of custody.\n\nReport publication is transactional through same-directory temporary output plus `fsync` and `os.replace`. The Docker image under `docker/wifi-auditor/` performs offline report verification only and receives the report directory read-only in the documented invocation; it does not perform live wireless scanning.\n\n---\n\n'''
          replace_once("docs/security.md", "# CSV exports\n", wifi_security + "# CSV exports\n")
          PY

      - name: Commit documentation synchronization
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.md docs/usage.md docs/security.md
          if (git diff --cached --quiet) {
            Write-Host "Documentation already synchronized."
          } else {
            git commit -m "Document WiFi Auditor"
            git push origin HEAD:feat/wifi-auditor-safe
          }
