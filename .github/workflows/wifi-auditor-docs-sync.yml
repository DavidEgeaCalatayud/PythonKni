name: WiFi Auditor Docs Sync

on:
  push:
    branches:
      - feat/wifi-auditor-safe

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Synchronize documentation
        shell: powershell
        run: |
          @'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace("README.md", "tests-731%20pytest", "tests-745%20pytest")
          replace("README.md", "branch%20coverage-93.1%25", "branch%20coverage-93.2%25")
          replace(
              "README.md",
              "| **WiFi Auditor** | One-click defensive visible-network inventory, security/channel findings, score and SHA-256 evidence reporting |",
              "| **WiFi Auditor** | One-click defensive inventory, ranked audit plan, offline PCAP/PCAPNG protocol metadata inspection, score and SHA-256 evidence reporting |",
          )
          replace("README.md", "The current behavior-driven suite contains **731 tests**.", "The current behavior-driven suite contains **745 tests**.")
          replace("README.md", "Repository-wide                 93.1%", "Repository-wide                 93.2%")
          replace("README.md", "WiFi Auditor service            99.1%", "WiFi Auditor service            98.5%")
          replace("README.md", "WiFi Auditor window             99.2%", "WiFi Auditor window             99.0%")
          replace(
              "README.md",
              "WiFi Auditor adds deterministic parsing/scoring, cancellation, evidence integrity and UI/export regressions while keeping offensive credential-acquisition behavior out of scope.",
              "WiFi Auditor adds deterministic parsing/scoring, target-aware defensive planning, offline PCAP/PCAPNG inspection, cancellation, evidence integrity and UI/export regressions while keeping credential-acquisition behavior out of scope.",
          )
          replace(
              "README.md",
              "- WiFi Auditor uses Windows visible-network enumeration only: it does not enable monitor mode, actively probe WPS, capture authentication material, validate passwords, crack PSKs or create deceptive access points.",
              "- WiFi Auditor uses Windows visible-network enumeration plus optional offline PCAP/PCAPNG inspection. It can count EAPOL/RSN frames through a locally installed `tshark`, but it does not enable monitor mode, actively probe WPS, capture authentication material from live targets, extract password-recovery material, validate passwords, crack PSKs or create deceptive access points. `tshark` remains an optional external executable outside the Python lock/SBOM.",
          )

          replace("docs/architecture.md", "731 pytest tests + branch coverage", "745 pytest tests + branch coverage")
          replace(
              "docs/architecture.md",
              "Current WiFi-Auditor baseline\n731 tests\n93.1% repository branch coverage\n93.6% aggregated services",
              "Current WiFi-Auditor baseline\n745 tests\n93.2% repository branch coverage\n93.6% aggregated services",
          )
          replace("docs/architecture.md", "WiFi Auditor service            99.1%", "WiFi Auditor service            98.5%")
          replace("docs/architecture.md", "WiFi Auditor window             99.2%", "WiFi Auditor window             99.0%")
          replace(
              "docs/architecture.md",
              "`wifi_auditor.service` owns Windows visible-network parsing, deterministic configuration findings, scoring and SHA-256 evidence generation. `wifi_auditor.window` owns the one-click managed-worker flow, cancellation, result rendering and export dialogs. The service never imports Qt.\n\nThe live scan is intentionally limited to information Windows exposes through `netsh wlan show networks mode=bssid`; no monitor-mode or credential-validation behavior is delegated to the service. Docker support is separated from live scanning and is limited to offline verification of exported evidence. The SHA-256 field is an integrity checksum over canonical report data, not a digital signature or provenance proof.",
              "`wifi_auditor.service` owns Windows visible-network parsing, deterministic findings/scoring, ranked defensive audit planning, offline PCAP/PCAPNG inspection and SHA-256 evidence generation. `wifi_auditor.window` owns the managed-worker flows, cancellation, result rendering, capture selection and export dialogs. The service never imports Qt.\n\nThe live scan is intentionally limited to information Windows exposes through `netsh wlan show networks mode=bssid`. Offline capture inspection validates existing files, hashes them and can optionally ask a local `tshark` executable to count EAPOL/RSN frames; it does not extract password-recovery material. Docker support is separated from live scanning and is limited to offline verification of exported report evidence. The SHA-256 field is an integrity checksum over canonical report data, not a digital signature or provenance proof.",
          )
          replace(
              "docs/architecture.md",
              "Other focused suites protect archive extraction safety, Temp Cleaner path identity, startup rollback, duplicate revalidation/manifests, process PID identity, CSV injection, worker lifecycle, dependency locks and structured feedback behavior.",
              "Other focused suites protect archive extraction safety, Temp Cleaner path identity, startup rollback, duplicate revalidation/manifests, process PID identity, CSV injection, worker lifecycle, dependency locks, structured feedback behavior and WiFi Auditor planning/offline-capture integrity contracts.",
          )

          replace(
              "docs/usage.md",
              "Press **Escanear redes visibles** to run one managed defensive pipeline: Windows visible-network inventory → SSID/BSSID normalization → band/channel/signal/security review → deterministic findings/score → exportable SHA-256 evidence. The operation supports cooperative cancellation and rejects overlapping scans.\n\nThe live scan uses `netsh wlan show networks mode=bssid`. It does not require stored WiFi passwords and does not enable monitor mode. The tool does not actively probe WPS, capture authentication exchanges, validate WiFi passwords, generate target password lists, crack PSKs or create clone/deceptive access points.\n\nExported JSON reports include the observed access points, findings, score, declared limitations and an integrity digest. Report publication uses same-directory temporary output, flush/`fsync` and `os.replace` before the destination becomes visible. The SHA-256 digest detects report changes; it is not a digital signature.",
              "Press **Escanear redes visibles** to run one managed defensive pipeline: Windows visible-network inventory → SSID/BSSID normalization → band/channel/signal/security review → deterministic findings/score → ranked defensive audit plan → exportable SHA-256 evidence. The operation supports cooperative cancellation and rejects overlapping work.\n\nPress **Analizar captura offline** to inspect an existing authorized PCAP/PCAPNG without interacting with a live target. PythonKni records format, size and SHA-256; when a local `tshark` executable is available it also counts EAPOL and RSN frames. If `tshark` is unavailable or fails, inspection degrades to built-in metadata only. It does not extract password hashes, PMKID material, keys or credentials.\n\nThe live scan uses `netsh wlan show networks mode=bssid`. It does not require stored WiFi passwords and does not enable monitor mode. The tool does not actively probe WPS, capture authentication exchanges from live targets, validate WiFi passwords, generate target password lists, crack PSKs or create clone/deceptive access points.\n\nExported schema-v2 JSON reports include observed access points, findings, the ranked `plan[]`, score, declared limitations and an integrity digest. Report publication uses same-directory temporary output, flush/`fsync` and `os.replace` before the destination becomes visible. The SHA-256 digest detects report changes; it is not a digital signature.",
          )
          replace("docs/usage.md", "suite contains **731 tests**", "suite contains **745 tests**")
          replace("docs/usage.md", "**93.1% repository-wide branch coverage**", "**93.2% repository-wide branch coverage**")

          replace(
              "docs/security.md",
              "The current feature deliberately excludes monitor mode, frame injection, active WPS probing, authentication-material capture, password-list generation, password cracking and deceptive/clone access points. An inconsistent SSID/security observation is surfaced as a manual-review indicator and is not treated as proof that a BSSID is malicious.",
              "The current feature deliberately excludes monitor mode, frame injection, active WPS probing, live authentication-material capture, password-list generation, password cracking and deceptive/clone access points. An inconsistent SSID/security observation is surfaced as a manual-review indicator and is not treated as proof that a BSSID is malicious.\n\nWiFi Auditor can inspect an existing PCAP/PCAPNG file offline. The built-in path validates the capture header and hashes the file; an optional local `tshark` installation can count EAPOL/RSN frames. It does not extract password hashes, PMKID material, keys or credentials. Capture files remain untrusted structured input to packet parsers, so analyze only intentionally obtained evidence and use isolation where appropriate. `tshark` is an external executable outside PythonKni's Python dependency lock and SBOM.",
          )
          '@ | python -

      - name: Commit documentation if required
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture.md docs/usage.md docs/security.md
          if (git diff --cached --quiet) {
            Write-Host "No documentation changes required."
          } else {
            git commit -m "Sync extended WiFi Auditor documentation"
            git push origin HEAD:feat/wifi-auditor-safe
          }
