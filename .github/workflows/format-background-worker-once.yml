name: Format background worker refactor once

on:
  push:
    branches:
      - refactor/reusable-background-worker

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/reusable-background-worker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.4

      - name: Format changed files
        run: python -m ruff format tools/worker.py tools/pdf_tasks.py tools/process_manager_tool.py tools/pdf_merge_tool.py tools/converter_tool.py tests/test_worker.py tests/test_background_tasks.py

      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/worker.py tools/pdf_tasks.py tools/process_manager_tool.py tools/pdf_merge_tool.py tools/converter_tool.py tests/test_worker.py tests/test_background_tasks.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Apply Ruff formatting to background worker refactor"
          git push origin HEAD:refactor/reusable-background-worker
