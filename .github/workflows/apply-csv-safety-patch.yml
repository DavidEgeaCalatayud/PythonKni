name: Apply CSV safety patch

on:
  push:
    branches:
      - fix/csv-injection
    paths:
      - scripts/apply_csv_safety_patch.py
      - .github/workflows/apply-csv-safety-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csv-injection
      - name: Apply targeted patch
        run: python scripts/apply_csv_safety_patch.py
      - name: Commit patch
        shell: powershell
        run: |
          if (-not (git diff --quiet -- tools/disk_analyzer_tool.py tools/network_tool.py pythonkni/startup/window.py pythonkni/event_viewer/window.py)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/disk_analyzer_tool.py tools/network_tool.py pythonkni/startup/window.py pythonkni/event_viewer/window.py
            git commit -m "Neutralize spreadsheet formulas in CSV exports"
            git push origin HEAD:fix/csv-injection
          }
