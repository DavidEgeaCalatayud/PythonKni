name: Apply reusable background worker refactor once

on:
  push:
    branches:
      - refactor/reusable-background-worker

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/reusable-background-worker

      - name: Apply payload
        shell: pwsh
        run: |
          $p1 = ''
          $p2 = ''
          $p3 = ''
          $payload = $p1 + $p2 + $p3
          [IO.File]::WriteAllBytes("payload.tgz", [Convert]::FromBase64String($payload))
          tar -xzf payload.tgz
          Remove-Item payload.tgz

      - name: Commit refactor
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/worker.py tools/pdf_tasks.py tools/process_manager_tool.py tools/pdf_merge_tool.py tools/converter_tool.py tests/test_worker.py tests/test_background_tasks.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Run slow GUI operations in reusable workers"
          git push origin HEAD:refactor/reusable-background-worker
