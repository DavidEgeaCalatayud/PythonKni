name: WiFi Auditor Format

on:
  push:
    branches:
      - feat/wifi-auditor-safe

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10.11"

      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Apply Ruff fixes and formatting
        shell: powershell
        run: |
          python -m ruff check --fix pythonkni/wifi_auditor tests/test_wifi_auditor_evidence.py tests/test_wifi_auditor_service.py tests/test_wifi_auditor_window.py scripts/verify_wifi_audit_report.py tools/wifi_auditor_tool.py
          python -m ruff format pythonkni/wifi_auditor tests/test_wifi_auditor_evidence.py tests/test_wifi_auditor_service.py tests/test_wifi_auditor_window.py scripts/verify_wifi_audit_report.py tools/wifi_auditor_tool.py

      - name: Commit formatting if required
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pythonkni/wifi_auditor tests/test_wifi_auditor_evidence.py tests/test_wifi_auditor_service.py tests/test_wifi_auditor_window.py scripts/verify_wifi_audit_report.py tools/wifi_auditor_tool.py
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes required."
          } else {
            git commit -m "Format WiFi Auditor files"
            git push origin HEAD:feat/wifi-auditor-safe
          }
