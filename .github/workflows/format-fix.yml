name: Temporary Ruff format fix

on:
  push:
    branches:
      - feat/structured-ui-feedback-complete
    paths:
      - .github/workflows/format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10.11"

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.5

      - name: Format repository
        run: python -m ruff format .

      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Format structured feedback changes"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
